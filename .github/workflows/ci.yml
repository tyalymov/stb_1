name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test

  cmake:
    name: cmake ${{ matrix.cmake }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cmake: ["4.3.6", "4.4.5"]
        experimental: [false]
        include:
          # Release candidates may break; they inform, they do not block.
          - os: ubuntu-latest
            cmake: "4.5.0-rc2"
            experimental: true
          - os: macos-latest
            cmake: "4.5.0-rc2"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .tools/cmake/${{ matrix.cmake }}
          key: cmake-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cmake }}
      - id: cmake
        run: echo "bin=$(scripts/install-cmake.sh ${{ matrix.cmake }})" >> "$GITHUB_OUTPUT"
      - run: ${{ steps.cmake.outputs.bin }}/cmake --version
      - run: uv run pytest -m cmake
        env:
          LONGPOLE_CMAKE: ${{ steps.cmake.outputs.bin }}
