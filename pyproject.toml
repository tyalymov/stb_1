[project]
name = "longpole"
dynamic = ["version"]
description = "Find the long pole in your CMake build: collects CMake instrumentation data and shows what actually gates the build."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Timur Ialymov", email = "yalymov.tm@gmail.com" }]
keywords = ["cmake", "build", "instrumentation", "telemetry", "critical-path"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=5.3",
    "jsonschema>=4.26.0",
    "rich>=15.0.0",
    "zstandard>=0.25.0",
]

[project.scripts]
longpole = "longpole.cli:main"

[project.urls]
Homepage = "https://github.com/tyalymov/longpole"
Issues = "https://github.com/tyalymov/longpole/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/longpole/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/longpole"]

[dependency-groups]
dev = [
    "ninja>=1.13.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # modern syntax for the supported Python range
    "B",        # likely bugs
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RET",      # return consistency
    "ARG",      # unused arguments
    "PTH",      # pathlib over os.path
    "D",        # docstrings: every public and private function and class has one
    "N",        # naming
    "RUF",      # ruff's own checks
    "T20",      # print(): stdout belongs to the output layer only
]
ignore = [
    "D203",  # "one blank line before class docstring" fights D211; Google style wants no blank line
    "D213",  # "summary on second line" fights D212; Google style starts the summary on the first line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures arrive as parameters that the body may not touch
# The module docstring of the entry point is the `--help` output verbatim, which
# starts with a wrapped usage block rather than a one-line summary.
"src/longpole/cli.py" = ["D205", "D415"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pydoclint]
style = "google"
exclude = '\.venv|tests'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
require-return-section-when-returning-nothing = false
# The Raises section documents the contract, including exceptions that
# propagate from callees (a missing index file surfaces as FileNotFoundError
# from the read). pydoclint only accepts exceptions raised literally in the
# body, so its raise checks are off; ruff still requires the section's shape.
skip-checking-raises = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "cmake: needs a CMake binary; set LONGPOLE_CMAKE or have cmake on PATH",
    "slow: runs real configure/build/test cycles; deselect with -m 'not slow'",
]
